<!doctype html>
<html lang="en-us">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Snow Rider 3D</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/bestiogames/snow@main/style.css" />
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #231f20;
      }
      .webgl-content {
        position: fixed !important;
        inset: 0 !important;
        width: 100vw !important;
        height: 100vh !important;
        transform: none !important;
        top: 0 !important;
        left: 0 !important;
      }
      #gameContainer {
        width: 100% !important;
        height: 100% !important;
        margin: 0 !important;
        padding: 0 !important;
        border: 0 !important;
        position: relative;
        background: #231f20;
      }
      #gameContainer canvas {
        width: 100% !important;
        height: 100% !important;
        display: block;
      }
    </style>
    <script src="https://cdn.jsdelivr.net/gh/bestiogames/snow@main/UnityProgress.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/bestiogames/snow@main/UnityLoader.js"></script>
  </head>
  <body>
    <div class="webgl-content">
      <div id="gameContainer"></div>
    </div>
    <script>
      var gameInstance = UnityLoader.instantiate(
        'gameContainer',
        'https://cdn.jsdelivr.net/gh/bestiogames/snow@main/SnowRider3D-gd-1.json',
        {
          onProgress: UnityProgress,
          Module: {
            onRuntimeInitialized: function () {
              UnityProgress(gameInstance, 'complete');
            },
          },
        }
      );
      document.addEventListener('pointerdown', function () {
        window.focus();
      });
    </script>
  </body>
</html>
