import fs from 'fs';
import path from 'path';

const gamesDir = path.resolve('public/games');
const aistudioDir = path.resolve('public/assets/aistudio');
const outDir = path.resolve('public/data');
const outFile = path.join(outDir, 'games.json');

if (!fs.existsSync(outDir)) {
  fs.mkdirSync(outDir, { recursive: true });
}

// Scan all AI Studio paste files to recover original cover image URLs
const recoveredUrls = [];
if (fs.existsSync(aistudioDir)) {
  const pasteFiles = fs.readdirSync(aistudioDir).sort();
  for (const pf of pasteFiles) {
    const fullPath = path.join(aistudioDir, pf);
    if (fs.statSync(fullPath).isFile()) {
      const content = fs.readFileSync(fullPath, 'utf8');
      const matches = content.match(/https?:\/\/[^\s"'<>]+/g) || [];
      for (const u of matches) {
        if (/\.(png|jpe?g|webp|gif|avif)(\?|$)/i.test(u) || /images|cover|thumb|icon|cdn|imgur|wikia|steam/i.test(u)) {
          recoveredUrls.push({ file: pf, url: u, text: content.toLowerCase() });
        }
      }
    }
  }
}

function findCoverForGame(id, title) {
  // 1. Check local public/images/ first
  for (const ext of ['jpg', 'jpeg', 'png', 'webp']) {
    if (fs.existsSync(path.resolve(`public/images/${id}.${ext}`))) {
      return `./images/${id}.${ext}`;
    }
  }

  // 2. Match against recovered AI Studio URLs by game keywords
  const keywords = id
    .split('-')
    .filter((w) => w.length > 2 && w !== 'old' && w !== 'embed' && w !== 'lite');

  for (const item of recoveredUrls) {
    const urlLower = item.url.toLowerCase();
    if (keywords.length > 0 && keywords.every((kw) => urlLower.includes(kw))) {
      return item.url;
    }
  }

  // 3. Fallback: check if the paste file mentions the game title alongside a single image URL
  for (const item of recoveredUrls) {
    if (item.text.includes(title.toLowerCase()) || item.text.includes(id.replace(/-/g, ' '))) {
      return item.url;
    }
  }

  return '';
}

const files = fs.existsSync(gamesDir) ? fs.readdirSync(gamesDir) : [];

const games = files
  .filter((f) => f.endsWith('.html') && !f.endsWith('-embed.html'))
  .sort()
  .map((file) => {
    const id = file.replace(/\.html$/i, '');
    const title = id
      .split('-')
      .map((w) => w.charAt(0).toUpperCase() + w.slice(1))
      .join(' ');

    return {
      id,
      title,
      category: 'Arcade',
      description: `Play ${title} directly in your browser.`,
      controls: 'Keyboard & Mouse',
      url: `./games/${file}`,
      path: `./games/${file}`,
      thumbnail: findCoverForGame(id, title),
    };
  });

fs.writeFileSync(outFile, JSON.stringify({ games }, null, 2), 'utf8');
console.log(`Generated ${games.length} games (found ${recoveredUrls.length} image URLs in AI Studio pastes).`);
