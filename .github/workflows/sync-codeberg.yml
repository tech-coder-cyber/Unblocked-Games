name: Sync and Build to Codeberg

on:
  push:
    branches:
      - '*'

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout GitHub repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Mirror repo to Codeberg
        env:
          CODEBERG_TOKEN: ${{ secrets.CODEBERG_TOKEN }}
        run: |
          git push --force --prune https://oauth2:${CODEBERG_TOKEN}@codeberg.org/study-hub/study-portal.git "refs/remotes/origin/*:refs/heads/*"

      - name: Setup Node and Build Vite
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install and Build
        run: |
          npm install --legacy-peer-deps
          npm run build -- --base=/study-portal/
          cp -rn data dist/ 2>/dev/null || true
          cp -rn games dist/ 2>/dev/null || true

      - name: Deploy dist to Codeberg pages branch
        env:
          CODEBERG_TOKEN: ${{ secrets.CODEBERG_TOKEN }}
        run: |
          cd dist
          git init
          git checkout -b pages
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add .
          git commit -m "Deploy built site to Codeberg Pages"
          git push --force https://oauth2:${CODEBERG_TOKEN}@codeberg.org/study-hub/study-portal.git pages
