<!doctype html>
<html lang="en-us">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>Zombie Road</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/gh/dem-google-usa/userconetn@main/TemplateData/style.css"
    />
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #020617;
      }
      #unity-container,
      #unity-canvas {
        width: 100% !important;
        height: 100% !important;
      }
    </style>
  </head>
  <body class="light">
    <div id="unity-container" class="unity-desktop">
      <canvas id="unity-canvas"></canvas>
    </div>
    <div id="loading-cover" style="display: none">
      <div id="unity-loading-bar">
        <div id="unity-logo">
          <img src="https://cdn.jsdelivr.net/gh/dem-google-usa/userconetn@main/logo.png" alt="Zombie Road" />
        </div>
        <div id="unity-progress-bar-empty" style="display: none">
          <div id="unity-progress-bar-full"></div>
        </div>
        <div class="spinner"></div>
      </div>
    </div>
    <script>
      const buildUrl = 'https://cdn.jsdelivr.net/gh/dem-google-usa/userconetn@main/Build';
      const loaderUrl = buildUrl + '/9853637125e801e9aae48e78dbbdcfca.loader.js';
      const config = {
        dataUrl: buildUrl + '/ec6245a615fb70dd75120c0410fa20d4.data.unityweb',
        frameworkUrl: buildUrl + '/96bd8aea39332cc87ed68099a2f6a038.framework.js.unityweb',
        codeUrl: buildUrl + '/224f969d7232878c58a25d91697031f7.wasm.unityweb',
        streamingAssetsUrl: 'StreamingAssets',
        companyName: 'SquareDino',
        productName: 'Road Chase Shooter',
        productVersion: '1.5.4',
      };

      const container = document.querySelector('#unity-container');
      const canvas = document.querySelector('#unity-canvas');
      const loadingCover = document.querySelector('#loading-cover');
      const progressBarEmpty = document.querySelector('#unity-progress-bar-empty');
      const progressBarFull = document.querySelector('#unity-progress-bar-full');
      const spinner = document.querySelector('.spinner');

      canvas.style.background =
        "url('https://cdn.jsdelivr.net/gh/dem-google-usa/userconetn@main/background.gif') center / cover";
      progressBarFull.style.background = '#FFFFFF';

      if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
        container.className = 'unity-mobile';
      }

      loadingCover.style.display = '';

      const unityLoader = document.createElement('script');
      unityLoader.src = loaderUrl;
      unityLoader.onload = () => {
        createUnityInstance(canvas, config, (progress) => {
          spinner.style.display = 'none';
          progressBarEmpty.style.display = '';
          progressBarFull.style.width = 100 * progress + '%';
        })
          .then((unityInstance) => {
            window.unityInstance = unityInstance;
            loadingCover.style.display = 'none';
          })
          .catch((message) => {
            console.error('Zombie Road WebGL error:', message);
          });
      };
      document.body.appendChild(unityLoader);

      document.addEventListener('pointerdown', () => {
        container.focus();
        window.focus();
        canvas.focus();
      });
    </script>
  </body>
</html>
