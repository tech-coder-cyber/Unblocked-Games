<!doctype html>
<html lang="en-us">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bank Robbery 2</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #020617;
        color: #f8fafc;
        font-family: system-ui, -apple-system, sans-serif;
      }
      #status {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 12px;
        text-align: center;
        padding: 24px;
        font-size: 14px;
        color: #cbd5e1;
      }
      .spinner {
        width: 34px;
        height: 34px;
        border-radius: 50%;
        border: 3px solid rgba(56, 189, 248, 0.25);
        border-top-color: #22d3ee;
        animation: spin 0.75s linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      iframe#gameFrame {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        border: 0;
        display: none;
      }
    </style>
  </head>
  <body>
    <div id="status">
      <div class="spinner" aria-hidden="true"></div>
      <div id="statusText">Loading Bank Robbery 2 assets...</div>
    </div>
    <iframe
      id="gameFrame"
      title="Bank Robbery 2"
      allow="fullscreen; autoplay; encrypted-media; pointer-lock; gamepad"
      allowfullscreen
    ></iframe>

    <script>
      (async function () {
        const RAW_BASE = 'https://raw.githubusercontent.com/rabanemeye/7878/main/';
        const CDN_BASE = 'https://cdn.jsdelivr.net/gh/rabanemeye/7878@main/';
        const statusEl = document.getElementById('status');
        const statusText = document.getElementById('statusText');
        const frame = document.getElementById('gameFrame');
        let createdUrls = [];

        window.addEventListener('pagehide', () => {
          for (const url of createdUrls) {
            try {
              URL.revokeObjectURL(url);
            } catch (e) {}
          }
          createdUrls = [];
        });

        try {
          const [xmlRes, cssRes, loaderRes] = await Promise.all([
            fetch(RAW_BASE + '1.xml'),
            fetch(RAW_BASE + 'TemplateData/style.css'),
            fetch(RAW_BASE + 'Build/BankRobbery2.loader.js'),
          ]);

          if (!xmlRes.ok) throw new Error('XML HTTP ' + xmlRes.status);
          if (!cssRes.ok) throw new Error('CSS HTTP ' + cssRes.status);
          if (!loaderRes.ok) throw new Error('Loader HTTP ' + loaderRes.status);

          const [xmlText, cssText, loaderJs] = await Promise.all([
            xmlRes.text(),
            cssRes.text(),
            loaderRes.text(),
          ]);

          const xmlDoc = new DOMParser().parseFromString(xmlText, 'application/xml');
          const contentEl = xmlDoc.querySelector('Content');
          let html = contentEl ? contentEl.textContent : xmlText;

          html = html.split(CDN_BASE).join(RAW_BASE);

          const loaderBlobUrl = URL.createObjectURL(
            new Blob([loaderJs], { type: 'application/javascript' })
          );
          createdUrls.push(loaderBlobUrl);

          const cssTag = '<style>' + cssText + '\nhtml,body,#unity-container,#unity-canvas{width:100%!important;height:100%!important;margin:0;padding:0;overflow:hidden}</style>';
          html = html.replace(
            /<link[^>]*href="[^"]*TemplateData\/style\.css"[^>]*>/i,
            cssTag
          );

          html = html.replace(
            'const loaderUrl = buildUrl + "/BankRobbery2.loader.js";',
            'const loaderUrl = ' + JSON.stringify(loaderBlobUrl) + ';'
          );

          html = html.replace(/alert\(([^)]+)\)/g, 'console.error($1)');

          const pageBlobUrl = URL.createObjectURL(new Blob([html], { type: 'text/html' }));
          createdUrls.push(pageBlobUrl);

          frame.addEventListener('load', () => {
            statusEl.style.display = 'none';
            frame.style.display = 'block';
            try {
              frame.focus();
            } catch (e) {}
          });
          frame.src = pageBlobUrl;
        } catch (err) {
          statusText.textContent =
            'Unable to start Bank Robbery 2 (' + (err && err.message ? err.message : 'network error') + ').';
        }
      })();
    </script>
  </body>
</html>
