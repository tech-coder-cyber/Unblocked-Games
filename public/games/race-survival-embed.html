<!doctype html>
<html lang="en-us">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>Race Survival</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/z-f3-f1/1@main/style.css" />
    <style>
      html,
      body {
        padding: 0;
        margin: 0;
        overflow: hidden;
        height: 100%;
        width: 100%;
        background: #020617;
        -webkit-user-select: none;
        user-select: none;
      }
      canvas:focus {
        outline: none;
      }
      #unity-container,
      #unity-canvas {
        width: 100% !important;
        height: 100% !important;
      }
    </style>
  </head>
  <body class="dark">
    <div id="unity-container" class="unity-desktop">
      <canvas id="unity-canvas" tabindex="-1"></canvas>
    </div>
    <div id="loading-cover" style="display: none">
      <div id="unity-loading-bar">
        <div id="unity-progress-bar-empty" style="display: none">
          <div id="unity-progress-bar-full"></div>
        </div>
        <div class="spinner"></div>
      </div>
    </div>

    <script>
      const buildUrl = 'https://cdn.jsdelivr.net/gh/z-f3-f1/1@main/Build';
      const loaderUrl = buildUrl + '/yandexBrotli.loader.js';
      const config = {
        dataUrl: buildUrl + '/yandexBrotli.data.br',
        frameworkUrl: buildUrl + '/yandexBrotli.framewor.js',
        streamingAssetsUrl: 'StreamingAssets',
        companyName: 'Brain massage',
        productName: 'Supercar Battle Royale',
        productVersion: '0.0.197',
      };

      const wasmFiles = ['yandexBrotli.wasm.br.part1', 'yandexBrotli.wasm.br.part2'];
      const container = document.querySelector('#unity-container');
      const canvas = document.querySelector('#unity-canvas');
      const loadingCover = document.querySelector('#loading-cover');
      const progressBarEmpty = document.querySelector('#unity-progress-bar-empty');
      const progressBarFull = document.querySelector('#unity-progress-bar-full');
      const spinner = document.querySelector('.spinner');

      if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
        container.className = 'unity-mobile';
      }

      loadingCover.style.background =
        "url('https://cdn.jsdelivr.net/gh/z-f3-f1/1@main/background.jpg') center / cover";
      loadingCover.style.display = '';

      let myGameInstance = null;
      let ysdk = null;
      let initGame = false;
      let nowFullAdOpen = false;
      let player = null;
      let payments = null;
      let mergedWasmUrl = null;

      window.addEventListener('pagehide', () => {
        if (mergedWasmUrl) {
          try {
            URL.revokeObjectURL(mergedWasmUrl);
          } catch (e) {}
          mergedWasmUrl = null;
        }
      });

      document.addEventListener('contextmenu', (event) => event.preventDefault());

      function FocusGame() {
        window.focus();
        canvas.focus();
      }
      window.addEventListener('pointerdown', FocusGame);
      window.addEventListener('touchstart', FocusGame);

      var cloudSaves = 'noData';
      var paymentsData = 'none';
      var playerData = 'noData';
      var environmentData = {
        language: 'en',
        domain: 'default_domain',
        deviceType: 'desktop',
        isMobile: false,
        isDesktop: true,
        isTablet: false,
        isTV: false,
        appID: 'default_app_id',
        browserLang: navigator.language || 'en',
        payload: null,
        promptCanShow: false,
        reviewCanShow: false,
        platform: navigator.platform,
        browser: 'Chrome',
      };

      function GetPayments() {
        return Promise.resolve('none');
      }
      function SaveCloud(jsonData) {
        try {
          window.parent.postMessage(
            { type: 'UNITY_SAVE', key: 'race_survival_cloud', data: jsonData },
            '*'
          );
        } catch (e) {}
      }
      function LoadCloud() {
        return Promise.resolve('noData');
      }
      function InitPlayer() {
        return Promise.resolve('noData');
      }
      function FullAdShow() {}
      function RewardedShow() {}
      function StickyAdActivity() {}
      function Review() {}
      function PromptShow() {}
      function InitLeaderboards() {}
      function GetLeaderboardScores() {}
      function SetLeaderboardScores() {}
      function ConsumePurchase() {}
      function ConsumePurchases() {}
      function InitLeaderboard() {}
      function BuyPayments() {}
      function InitGame() {
        initGame = true;
      }

      async function loadAndMergeWasm(files) {
        const buffers = [];
        for (const file of files) {
          const res = await fetch(buildUrl + '/' + file);
          if (!res.ok) throw new Error('Failed to load ' + file + ' (' + res.status + ')');
          buffers.push(new Uint8Array(await res.arrayBuffer()));
        }
        return new Blob(buffers, { type: 'application/wasm' });
      }

      (async function () {
        try {
          const mergedWasmBlob = await loadAndMergeWasm(wasmFiles);
          mergedWasmUrl = URL.createObjectURL(mergedWasmBlob);
          config.codeUrl = mergedWasmUrl;

          const script = document.createElement('script');
          script.src = loaderUrl;
          script.onload = () => {
            createUnityInstance(canvas, config, (progress) => {
              spinner.style.display = 'none';
              progressBarEmpty.style.display = '';
              progressBarFull.style.width = 100 * progress + '%';
            })
              .then((unityInstance) => {
                myGameInstance = unityInstance;
                loadingCover.style.display = 'none';
              })
              .catch((err) => {
                console.error('Race Survival Unity error:', err);
              });
          };
          document.body.appendChild(script);
        } catch (err) {
          console.error('Race Survival bootstrap error:', err);
        }
      })();
    </script>
  </body>
</html>
